# =============================================================================
# CI/CD Pipeline — BachKhoa ERP
# =============================================================================
# Luồng:  Push main → Backend checks → Build backend image → Push GHCR → SSH deploy VPS
#
# Secrets cần tạo trong GitHub (Settings → Secrets → Actions):
#   VPS_HOST        — IP hoặc domain VPS  (ví dụ: 203.0.113.50)
#   VPS_USER        — User SSH            (ví dụ: deploy)
#   VPS_SSH_KEY     — Private key SSH     (nội dung file id_ed25519)
#   VPS_DEPLOY_PATH — Thư mục trên VPS   (ví dụ: /opt/bachkhoa-erp)
# =============================================================================

name: Deploy BachKhoa ERP

on:
  push:
    branches: [main]
  workflow_dispatch:          # Cho phép chạy tay từ tab Actions

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ryhtruly/bachkhoa-erp-backend
  FRONTEND_IMAGE: ghcr.io/ryhtruly/bachkhoa-erp-frontend

jobs:
  # ─── Job 1a: Kiểm tra frontend ──────────────────────────────────────
  frontend-test:
    name: 🧪 Check Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dev/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  # ─── Job 1b: Kiểm tra backend ───────────────────────────────────────
  backend-test:
    name: 🐍 Run Backend Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bachkhoa_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bachkhoa_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: dev/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dev/backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile backend sources
        run: python -m compileall -q src

      - name: Run backend tests
        env:
          ENV: development
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bachkhoa_erp_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bachkhoa_erp_application_placeholder
        run: python -m pytest -q -p no:cacheprovider

  # ─── Job 2: Build & push Docker images ──────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]  # Chỉ build khi frontend và backend đều passed
    permissions:
      contents: read
      packages: write           # Quyền push lên GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build & push Backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./dev/backend
          file: ./dev/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ──
      - name: Build & push Frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./dev/frontend
          file: ./dev/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy lên VPS ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push       # Chỉ chạy khi build xong
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 2025 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Login vào GHCR để pull private images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Chọn image backend và frontend bất biến theo commit SHA vừa push lên GHCR.
            export BACKEND_IMAGE_TAG=${{ github.sha }}
            export FRONTEND_IMAGE_TAG=${{ github.sha }}

            # Pull images mới của cả backend và frontend.
            docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml pull

            # Khởi chạy backend và frontend cùng Redis; MinIO dùng instance có sẵn trên VPS.
            docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml up -d --no-build --remove-orphans

            # In trạng thái để bước deploy có bằng chứng rõ ràng.
            docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml ps

            echo "✅ Deploy thành công lúc $(date '+%Y-%m-%d %H:%M:%S')"
