# =============================================================================
# CI/CD Pipeline — BachKhoa ERP
# =============================================================================
# Luồng:  Push main → Vitest → Build images → Push GHCR → SSH deploy VPS
#
# Secrets cần tạo trong GitHub (Settings → Secrets → Actions):
#   VPS_HOST        — IP hoặc domain VPS  (ví dụ: 203.0.113.50)
#   VPS_USER        — User SSH            (ví dụ: deploy)
#   VPS_SSH_KEY     — Private key SSH     (nội dung file id_ed25519)
#   VPS_DEPLOY_PATH — Thư mục trên VPS   (ví dụ: /opt/bachkhoa-erp)
# =============================================================================

name: Deploy BachKhoa ERP

on:
  push:
    branches: [main]
  workflow_dispatch:          # Cho phép chạy tay từ tab Actions

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ryhtruly/bachkhoa-erp-backend
  FRONTEND_IMAGE: ghcr.io/ryhtruly/bachkhoa-erp-frontend

jobs:
  # ─── Job 1: Chạy test frontend ──────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Vitest
        run: npm test

  # ─── Job 2: Build & push Docker images ──────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: test                 # Chỉ chạy khi test passed
    permissions:
      contents: read
      packages: write           # Quyền push lên GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend image ──
      - name: Build & push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./dev/backend
          file: ./dev/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ──
      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./dev/frontend
          file: ./dev/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy lên VPS ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push       # Chỉ chạy khi build xong
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Login vào GHCR để pull private images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull images mới nhất
            docker compose -f docker-compose.prod.yml pull

            # Khởi động lại với image mới (zero-downtime nếu dùng --remove-orphans)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Dọn image cũ để tiết kiệm ổ cứng
            docker image prune -f

            echo "✅ Deploy thành công lúc $(date '+%Y-%m-%d %H:%M:%S')"
