# =============================================================================
# CI/CD Pipeline — BachKhoa ERP
# =============================================================================
# Luồng:  Push main → Backend checks → Build backend image → Push GHCR → SSH deploy VPS
#
# Secrets cần tạo trong GitHub (Settings → Secrets → Actions):
#   VPS_HOST        — IP hoặc domain VPS  (ví dụ: 203.0.113.50)
#   VPS_USER        — User SSH            (ví dụ: deploy)
#   VPS_SSH_KEY     — Private key SSH     (nội dung file id_ed25519)
#   VPS_DEPLOY_PATH — Thư mục trên VPS   (ví dụ: /opt/bachkhoa-erp)
# =============================================================================

name: Deploy BachKhoa ERP

on:
  push:
    branches: [main]
  workflow_dispatch:          # Cho phép chạy tay từ tab Actions

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ryhtruly/bachkhoa-erp-backend

jobs:
  # ─── Job 1: Kiểm tra backend ────────────────────────────────────────
  test:
    name: 🧪 Check Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q src

  # ─── Job 2: Build & push backend image ──────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Backend
    runs-on: ubuntu-latest
    needs: test                 # Chỉ chạy khi test passed
    permissions:
      contents: read
      packages: write           # Quyền push lên GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./dev/backend
          file: ./dev/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Deploy lên VPS ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push       # Chỉ chạy khi build xong
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 2025
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            # Login vào GHCR để pull private images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Chọn image backend vừa push lên GHCR.
            export BACKEND_IMAGE_TAG=latest

            # Pull backend image mới và các service phụ thuộc của backend.
            docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml pull

            # Chạy backend cùng Redis; MinIO dùng instance có sẵn trên VPS.
            docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml up -d --no-build --remove-orphans

            # In trạng thái để bước deploy có bằng chứng rõ ràng.
            docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml ps

            echo "✅ Deploy thành công lúc $(date '+%Y-%m-%d %H:%M:%S')"
