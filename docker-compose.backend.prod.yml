# Backend-only production stack using the existing VPS MinIO.
#
# Use this file when the frontend is deployed separately or when only the
# backend image needs to be built/run. DATABASE_URL and application secrets
# must be provided through dev/backend/.env on the deployment host. Run with
# `docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml`.

name: bachkhoa-erp-backend-prod

services:
  redis-contracts:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./dev/backend
      dockerfile: Dockerfile.prod
    image: ghcr.io/ryhtruly/bachkhoa-erp-backend:${BACKEND_IMAGE_TAG:?Thiếu BACKEND_IMAGE_TAG để dùng image bất biến}
    restart: unless-stopped
    init: true
    env_file:
      - ./dev/backend/.env
    environment:
      ENV: production
      SEED_ADMIN_ENABLED: "false"
      REDIS_URL: redis://redis-contracts:6379/0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Thiếu MINIO_ENDPOINT trong dev/backend/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:?Thiếu MINIO_BUCKET trong dev/backend/.env}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?Thiếu MINIO_PUBLIC_URL trong dev/backend/.env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-bachkhoa-erp-files}
      OBJECT_STORAGE_ALLOW_PUBLIC_BUCKETS: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - contract-files:/app/static/contracts
    depends_on:
      redis-contracts:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./dev/frontend
      dockerfile: Dockerfile
    image: ghcr.io/ryhtruly/bachkhoa-erp-frontend:${FRONTEND_IMAGE_TAG:?Thiếu FRONTEND_IMAGE_TAG để dùng image bất biến}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3222:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  contract-files:

