# Backend-only production stack.
#
# Use this file when the frontend is deployed separately or when only the
# backend image needs to be built/run. DATABASE_URL and application secrets
# must be provided through dev/backend/.env on the deployment host. Run with
# `docker compose --env-file dev/backend/.env -f docker-compose.backend.prod.yml`.

name: bachkhoa-erp-backend-prod

services:
  redis-contracts:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Thiếu MINIO_ACCESS_KEY trong dev/backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Thiếu MINIO_SECRET_KEY trong dev/backend/.env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./dev/backend
      dockerfile: Dockerfile.prod
    image: ghcr.io/ryhtruly/bachkhoa-erp-backend:${BACKEND_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    env_file:
      - ./dev/backend/.env
    environment:
      ENV: production
      SEED_ADMIN_ENABLED: "false"
      REDIS_URL: redis://redis-contracts:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-bachkhoa-erp-files}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://minio:9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-bachkhoa-erp-files}
      OBJECT_STORAGE_ALLOW_PUBLIC_BUCKETS: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - contract-files:/app/static/contracts
    depends_on:
      redis-contracts:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  contract-files:
  minio-data:
