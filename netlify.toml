# Netlify Configuration for Bach Khoa ERP

[build]
  base = "dev/frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Redirect/proxy rules được đặt trong dev/frontend/public/_redirects vì đây là
# thư mục publish của Netlify và được xử lý trước các rule trong file này.
